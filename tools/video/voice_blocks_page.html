<title>A1 Voice Blocks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column of copy cards, one card per audio file, in recording order. */
:root {
  --bg: #F3F5F7; --card: #FFFFFF; --fg: #17202A; --dim: #5B6773; --line: #D9DFE5;
  --accent: #0E6E5C; --accent-fg: #FFFFFF; --teacher: #0E6E5C; --meera: #A2456E; --ravi: #8A5A12;
  --done: #E7F3EF; --tag: #6B4FA0;
  --display: "Space Grotesk", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1418; --card: #182027; --fg: #E6ECF1; --dim: #95A3AF; --line: #2A353F;
  --accent: #39B89C; --accent-fg: #062019; --teacher: #39B89C; --meera: #E487AE; --ravi: #E0B05A;
  --done: #15302A; --tag: #B9A2E8; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1418; --card: #182027; --fg: #E6ECF1; --dim: #95A3AF; --line: #2A353F;
  --accent: #39B89C; --accent-fg: #062019; --teacher: #39B89C; --meera: #E487AE; --ravi: #E0B05A;
  --done: #15302A; --tag: #B9A2E8; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; }
h1 { font-family: var(--display); font-size: 26px; margin: 0; text-wrap: balance; }
.sub { color: var(--dim); margin: 2px 0 0; }
details.tips { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
details.tips summary { font-weight: 600; cursor: pointer; }
details.tips ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; }
.opt input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.opt small { display: block; color: var(--dim); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.card.is-done { background: var(--done); }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.file { font-family: var(--mono); font-size: 15px; font-weight: 500; }
.who { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.who.Teacher { color: var(--teacher); } .who.Meera { color: var(--meera); } .who.Ravi { color: var(--ravi); }
.meta { color: var(--dim); font-size: 13px; width: 100%; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
button.copy { font: 600 16px var(--body); background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px;
  padding: 12px 18px; min-width: 150px; cursor: pointer; }
button.copy:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid var(--tag); outline-offset: 2px; }
label.mark { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 14px; }
label.mark input { width: 18px; height: 18px; accent-color: var(--accent); }
details.text summary { color: var(--dim); font-size: 14px; cursor: pointer; }
pre { white-space: pre-wrap; word-break: break-word; font-family: var(--body); font-size: 14px; margin: 8px 0 0;
  max-height: 340px; overflow: auto; border-top: 1px solid var(--line); padding-top: 8px; user-select: all; }
pre .t { color: var(--tag); font-weight: 600; }
.foot { color: var(--dim); font-size: 13px; }
.part { display: grid; gap: 10px; }
.part h2 { font-family: var(--display); font-size: 20px; margin: 10px 0 0; }
.part .pm { color: var(--dim); font-size: 13px; margin: 0; }
.turn { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.turn.is-done { background: var(--done); }
.turn.Teacher { --c: var(--teacher); } .turn.Meera { --c: var(--meera); } .turn.Ravi { --c: var(--ravi); }
.turn .row { justify-content: space-between; }
.turn .txt { font-size: 14px; margin: 0; color: var(--fg); max-height: 4.6em; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
.turn.open .txt { max-height: none; }
.more { background: none; border: 0; color: var(--dim); font: 13px var(--body); padding: 0; cursor: pointer; text-align: left; }
button.copy { padding: 10px 16px; min-width: 120px; font-size: 15px; }
</style>

<div class="wrap">
  <header>
    <h1>{{H1}}</h1>
    <p class="sub">{{SUB}}</p>
  </header>

  <details class="tips" open>
    <summary>How to use it</summary>
    <ul>
{{TIPS}}
    </ul>
  </details>

  <label class="opt" for="tags">
    <input type="checkbox" id="tags" checked>
    <span><b>Keep expression tags</b> like [chuckles] and [laughs]
      <small>Works on Eleven v3. If a voice reads the words out loud, turn this off and copy again.</small></span>
  </label>

  <main id="list" style="display:grid;gap:14px"></main>
  <p class="foot">From {{SRC}}. Line ids are kept, so the video can be cut automatically from each part.</p>
</div>

<script>
const PARTS = /*DATA*/[];
const list = document.getElementById('list');
const tags = document.getElementById('tags');
const TAG = /\[[a-z ]+\]\s*/gi;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const clean = s => tags.checked ? s : s.replace(TAG, '');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function render() {
  list.innerHTML = '';
  PARTS.forEach((p, pi) => {
    const sec = document.createElement('section');
    sec.className = 'part';
    const chars = p.turns.reduce((a, t) => a + clean(t.text).length, 0);
    sec.innerHTML = '<h2>Part ' + (pi + 1) + ' · ' + p.file + '</h2><p class="pm">' + esc(p.section) + ' · ' + (p.turns.length > 1 ? p.turns.length + ' turns · ' : '') + chars + ' characters</p>';
    p.turns.forEach((t, ti) => {
      const key = 'd-' + p.file + '-' + ti;
      const text = clean(t.text);
      const done = store.get(key) === '1';
      const el = document.createElement('div');
      el.className = 'turn ' + t.speaker + (done ? ' is-done' : '');
      const uid = pi + '-' + ti;
      el.innerHTML =
        '<div class="row"><span><span class="file">' + (ti + 1) + '.</span> <span class="who ' + t.speaker + '">' + t.speaker + '</span></span>' +
        '<button class="copy" id="copy-' + uid + '" type="button">Copy</button></div>' +
        '<p class="txt" id="txt-' + uid + '">' + esc(text).replace(/\[[a-z ]+\]/gi, m => '<span class="t" style="color:var(--tag);font-weight:600">' + m + '</span>') + '</p>' +
        '<div class="row"><button class="more" type="button">Show all</button>' +
        '<label class="mark"><input type="checkbox" id="done-' + uid + '"' + (done ? ' checked' : '') + '> Pasted</label></div>';
      sec.appendChild(el);
      const btn = el.querySelector('.copy');
      const mark = el.querySelector('input');
      const setDone = v => { mark.checked = v; el.classList.toggle('is-done', v); store.set(key, v ? '1' : '0'); };
      btn.addEventListener('click', () => {
        const ok = () => { btn.textContent = 'Copied ✓'; setDone(true); setTimeout(() => btn.textContent = 'Copy', 1600); };
        const fallback = () => {
          el.classList.add('open');
          const r = document.createRange(); r.selectNodeContents(el.querySelector('.txt'));
          const s = getSelection(); s.removeAllRanges(); s.addRange(r);
          btn.textContent = 'Long-press, Copy';
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(clean(t.text)).then(ok, fallback);
        else fallback();
      });
      el.querySelector('.more').addEventListener('click', e => {
        const o = el.classList.toggle('open'); e.target.textContent = o ? 'Show less' : 'Show all';
      });
      mark.addEventListener('change', e => setDone(e.target.checked));
    });
    list.appendChild(sec);
  });
}
const saved = store.get('tags'); if (saved !== null) tags.checked = saved === '1';
tags.addEventListener('change', () => { store.set('tags', tags.checked ? '1' : '0'); render(); });
render();
</script>
